---
- name: Install apt repository
  when: ansible_os_family == "Debian"
  block:
    - name: Install prerequisites
      ansible.builtin.apt:
        name:
          - gnupg
          - apt-transport-https
          - python3-debian
        update_cache: true

    - name: Set apt repository facts
      ansible.builtin.set_fact:
        is_deb882: "{{ is_deb882_debian or is_deb882_ubuntu }}"
      vars:
        is_deb882_debian: "{{ (ansible_facts.distribution == 'Debian') and (ansible_facts.distribution_version is version('11', '>=')) }}"
        is_deb882_ubuntu: "{{ (ansible_facts.distribution == 'Ubuntu') and (ansible_facts.distribution_version is version('22.04', '>=')) }}"

    - name: Deploy legacy apt repository definition
      when: not is_deb882
      block:
        - name: Set repo gpg key fact
          ansible.builtin.set_fact:
            mongodb_repo_gpg_key: "{{ url }}"
          vars:
            version: "{{ mongodb_repo_release | string }}"
            url: "https://pgp.mongodb.com/server-{{ version.split('.') | first }}.0.asc"

        - name: Install MongoDB apt key
          ansible.builtin.apt_key:
            url: "{{ mongodb_repo_gpg_key }}"

        - name: Clean apt repository
          ansible.builtin.file:
            state: absent
            path: /etc/apt/sources.list.d/mongodb.list
          changed_when: false

        - name: Add Debian apt repository
          ansible.builtin.apt_repository:
            filename: mongodb
            repo: "{{ _repo }}"
          vars:
            _repo_apt_base: "deb [ arch=amd64,arm64 ] {{ mongodb_repo_baseurl }}/apt/{{ ansible_distribution | lower }}"
            _repo_apt_component: "{{ 'main' if (ansible_distribution == 'Debian') else 'multiverse' }}"
            _repo: "{{ _repo_apt_base }} {{ ansible_distribution_release }}/mongodb-org/{{ mongodb_repo_release }} {{ _repo_apt_component }}"
          changed_when: false

    - name: Deploy deb882 repository definition
      when: is_deb882
      block:
        - name: Install deb882 repository
          ansible.builtin.deb822_repository:
            name: mongodb
            uris: "{{ mongodb_repo_baseurl }}/apt/{{ ansible_distribution | lower }}"
            suites: "{{ ansible_distribution_release }}/mongodb-org/{{ mongodb_repo_release }}"
            components: "{{ 'main' if (ansible_distribution == 'Debian') else 'multiverse' }}"
            signed_by: "{{ mongodb_repo_gpg_key }}"
            state: present
            enabled: true

    - name: Update apt repos
      ansible.builtin.apt:
        update_cache: true

- name: Install yum repository
  when: ansible_os_family == "RedHat"
  block:
    - name: Install prerequisites
      ansible.builtin.dnf:
        name: gnupg2
        update_cache: true

    - name: Clean yum repository
      ansible.builtin.file:
        state: absent
        path: /etc/yum.repos.d/mongodb.repo
      changed_when: false

    - name: Install MongoDB yum key
      ansible.builtin.yum_repository:
        name: mongodb
        description: MongoDB Repository
        baseurl: "{{ _mongodb_yum_base }}/{{ mongodb_repo_release }}/{{ ansible_architecture }}/"
        enabled: true
        gpgcheck: true
        gpgkey: "https://www.mongodb.org/static/pgp/server-{{ mongodb_repo_release }}.asc"
      vars:
        _mongodb_yum_base: "{{ mongodb_repo_baseurl }}/yum/redhat/$releasever/mongodb-org"
      changed_when: false

    - name: Update yum cache
      ansible.builtin.dnf:
        update_cache: true
